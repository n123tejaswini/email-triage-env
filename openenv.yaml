# openenv.yaml
name: email-triage-env
version: "1.0.0"
description: >
  A real-world email triage environment where an AI agent reads
  emails and classifies, prioritizes, and responds to them.
  Simulates a common knowledge-worker task.

author: "your-name"
tags: ["email", "triage", "nlp", "classification", "real-world"]

tasks:
  - id: spam_detection
    name: "Spam Detection"
    difficulty: easy
    max_steps: 5
    description: "Classify 5 emails as spam or not_spam"

  - id: priority_sorting
    name: "Priority Sorting"
    difficulty: medium
    max_steps: 8
    description: "Label urgency and assign priority 1-3 for 8 emails"

  - id: full_triage
    name: "Full Triage with Phishing"
    difficulty: hard
    max_steps: 6
    description: "Label, prioritize, detect phishing, and draft replies for 6 emails"

action_space:
  type: object
  fields:
    label: string       # Required always
    priority: integer   # Optional (medium + hard)
    reply_draft: string # Optional (hard only)

observation_space:
  type: object
  fields:
    task_id: string
    step: integer
    current_email: object
    emails_remaining: integer
    instructions: string

reward_range: [0.0, 1.0]
episode_end: "when all emails in task are processed"

endpoints:
  reset: POST /reset
  step: POST /step
  state: GET /state