[project]
name = "email-triage-env"
version = "1.0.0"
description = "A real-world email triage environment where AI agents classify, prioritize, and respond to emails."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.111.0",
    "uvicorn==0.29.0",
    "pydantic==2.7.1",
    "openai==1.30.0",
    "python-dotenv==1.0.1",
]

[project.urls]
Homepage = "https://huggingface.co/spaces/tejaswinin0413/email-triage-env"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.backends.legacy:build"